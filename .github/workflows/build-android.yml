name: Build Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Web Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp game.js android/app/src/main/assets/
          echo "Web assets successfully copied into Android assets folder."

      - name: Build with Gradle
        run: |
          cd android
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle wrapper jar..."
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename and Prepare APK Artifact
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Tank-BattleCity-v1.0.0-debug.apk
          echo "APK successfully built and renamed."

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tank-BattleCity-Android-APK
          path: build-output/Tank-BattleCity-v1.0.0-debug.apk
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/Tank-BattleCity-v1.0.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
