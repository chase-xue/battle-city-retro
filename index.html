<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>经典坦克大战 - 网页版 / 微信版直接试玩</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .main-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #1e1e1e;
      border: 3px solid #333;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      max-width: 100vw;
    }

    #gameCanvas {
      background: #000;
      border: 2px solid #555;
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      touch-action: none;
    }

    .tip-bar {
      margin-top: 10px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }

    @media (max-width: 600px), (max-height: 720px) {
      body {
        padding: 0;
        margin: 0;
        justify-content: flex-start;
      }
      .main-wrap {
        border: none;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
        background: #000;
        width: 100vw;
        height: 100vh;
        justify-content: center;
      }
      #gameCanvas {
        border: none;
        width: 100vw;
        height: auto;
        max-height: 100vh;
      }
      .tip-bar {
        display: none;
      }
    }

    kbd {
      background: #333;
      color: #ffd700;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #555;
      font-family: monospace;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="main-wrap">
    <canvas id="gameCanvas" width="480" height="680"></canvas>
    <div class="tip-bar">
      🎮 键盘：<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 | <kbd>J</kbd> 或 <kbd>空格</kbd> 开火 &nbsp;|&nbsp; 🖱️ 鼠标：直接点击下方按钮
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
